name: tile_manager
description: Elegant Tile — Contractor estimating & business management app
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  share_plus: ^7.2.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  path_provider: ^2.1.2
  collection: ^1.18.0
  http: ^1.2.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  open_filex: ^4.3.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#0D0D0D"
  image: assets/icon.png
  android: true
  ios: false
  android_gravity: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
